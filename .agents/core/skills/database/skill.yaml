name: database
description: Database architecture, schema design, Prisma, Drizzle ORM, indexing strategies, migrations, and N+1 query resolution.
version: 1.0.0
category: backend
requires:
  - system-design
  - typescript
triggers:
  files:
    - "*.prisma"
    - "schema.prisma"
    - "drizzle.config.*"
    - "migrations/*"
    - "*.sql"
  keywords:
    - "database"
    - "prisma"
    - "drizzle"
    - "postgres"
    - "postgresql"
    - "sql"
    - "migration"
    - "index"
    - "transaction"
    - "orm"
